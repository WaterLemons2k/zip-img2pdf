version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    # Force dependabot to completely skip
    ignore:
      - dependency-name: '*'
